<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Social Network</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- ===== ЭКРАН АВТОРИЗАЦИИ ===== -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-logo">
                <i class="fab fa-telegram-plane"></i>
                <h1>Telegram</h1>
                <p>Социальная сеть</p>
            </div>
            
            <div id="loginForm" class="auth-form">
                <h2>Вход</h2>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="loginPhone" placeholder="Номер телефона" value="+7">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Пароль">
                </div>
                <button onclick="login()" class="auth-btn">Войти</button>
                <p class="auth-switch">Нет аккаунта? <span onclick="showRegister()">Зарегистрироваться</span></p>
            </div>

            <div id="registerForm" class="auth-form" style="display:none;">
                <h2>Регистрация</h2>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regName" placeholder="Имя">
                </div>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="regPhone" placeholder="Номер телефона" value="+7">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)">
                </div>
                <button onclick="register()" class="auth-btn">Зарегистрироваться</button>
                <p class="auth-switch">Уже есть аккаунт? <span onclick="showLogin()">Войти</span></p>
            </div>

            <div id="verifyForm" class="auth-form" style="display:none;">
                <h2>Подтверждение</h2>
                <p style="color: #6a6a6a; text-align: center; margin-bottom: 20px; font-size: 14px;">
                    Код отправлен на номер<br>
                    <strong id="verifyPhone" style="color: #e0e0e0;">+7</strong>
                </p>
                <div class="code-inputs">
                    <input type="text" maxlength="1" class="code-input" id="code1" autofocus>
                    <input type="text" maxlength="1" class="code-input" id="code2">
                    <input type="text" maxlength="1" class="code-input" id="code3">
                    <input type="text" maxlength="1" class="code-input" id="code4">
                    <input type="text" maxlength="1" class="code-input" id="code5">
                    <input type="text" maxlength="1" class="code-input" id="code6">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button onclick="verifyCode()" class="auth-btn" style="flex: 2;">Подтвердить</button>
                    <button onclick="resendCode()" class="auth-btn" style="flex: 1; background: #2b2b2b;" id="resendBtn">
                        <span id="resendText">Снова</span>
                        <span id="timerText" style="display:none;"></span>
                    </button>
                </div>
                <p class="auth-switch" style="margin-top: 16px;">
                    <span onclick="showLogin()" style="color: #6ab2f2;">← Назад</span>
                </p>
            </div>
        </div>
    </div>

    <!-- ===== ОСНОВНОЕ ОКНО ===== -->
    <div id="mainApp" class="telegram-window" style="display:none;">
        <div class="left-panel" id="leftPanel">
            <div class="left-header">
                <div class="brand">
                    <i class="fab fa-telegram-plane"></i>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Поиск" id="searchInput">
                </div>
            </div>
            
            <div class="contacts-header">
                <span>Мои контакты</span>
                <button onclick="showAddContact()"><i class="fas fa-user-plus"></i></button>
            </div>
            
            <div class="chat-list" id="chatList"></div>
            
            <div class="user-profile" id="userProfile">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div class="profile-info">
                    <span id="profileName">Пользователь</span>
                    <span id="profilePhone">+7</span>
                </div>
                <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="right-panel" id="rightPanel">
            <div class="chat-header">
                <div class="mobile-back" id="mobileBack">
                    <i class="fas fa-arrow-left"></i>
                </div>
                <div class="avatar" id="chatAvatar">Ч</div>
                <div class="info">
                    <h3 id="chatName">Выберите чат</h3>
                    <span id="chatStatus">онлайн</span>
                </div>
                <div class="actions">
                    <i class="fas fa-phone"></i>
                    <i class="fas fa-video"></i>
                </div>
            </div>

            <div class="messages-area" id="messagesArea">
                <div class="empty-chat">
                    <i class="fas fa-comment-dots"></i>
                    <p>Выберите чат или создайте новый</p>
                    <button onclick="showAddContact()" class="empty-btn">➕ Добавить контакт</button>
                </div>
            </div>

            <div class="chat-input">
                <i class="fas fa-smile attach"></i>
                <i class="fas fa-paperclip attach"></i>
                <input type="text" id="messageInput" placeholder="Сообщение..." disabled>
                <button id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
    <div id="addContactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Добавить контакт</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="contactName" placeholder="Имя контакта">
                </div>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="contactPhone" placeholder="Номер телефона" value="+7">
                </div>
                <button onclick="addContact()" class="auth-btn">Добавить</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
